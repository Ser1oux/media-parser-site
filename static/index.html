<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>解析下载站</title>
<link rel="preload" href="fonts/fonts.css" as="style">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ==================================================================
   设计令牌 —— 取自 Apple Human Interface Guidelines（web idiom）
   数值参考 STiXzoOR/applecn（Apple HIG → CSS 变量）实测整理
   ================================================================== */
:root[data-theme="light"]{
  /* 系统色 */
  --system-blue:rgb(0 136 255); --system-red:rgb(255 56 60);
  --system-green:rgb(52 199 89); --system-orange:rgb(255 141 40);
  /* 颜色角色 */
  --label:rgb(0 0 0);
  --label-2:rgb(60 60 67 / .6); --label-3:rgb(60 60 67 / .3); --label-4:rgb(60 60 67 / .18);
  --fill:rgb(120 120 128 / .2); --fill-2:rgb(120 120 128 / .16);
  --fill-3:rgb(118 118 128 / .12); --fill-4:rgb(116 116 128 / .08);
  --background-1:rgb(255 255 255); --background-2:rgb(242 242 247); --background-3:rgb(255 255 255);
  --separator:rgb(60 60 67 / .29); --separator-opaque:rgb(198 198 200);
  /* 材料（Liquid Glass 材质层） */
  --material-glass-bg:rgb(245 245 247 / .55);
  --material-glass-fallback:rgb(242 242 247);
  --material-glass-blur:16px; --material-glass-saturate:2.2;
  --material-glass-clear-bg:rgb(255 255 255 / .25);
  --material-glass-clear-blur:10px; --material-glass-clear-saturate:1.8;
  --material-regular-bg:rgb(250 250 252 / .8);
  --material-regular-blur:20px; --material-regular-saturate:1.8;
  --fill-pill:rgb(120 120 128 / .12);
  /* 玻璃投影 */
  --elevation-glass:inset 0 0 0 1px rgb(0 0 0 / .05), 0 10px 40px rgb(0 0 0 / .1);
  --elevation-card:0 4px 12px rgb(0 0 0 / .07), 0 12px 32px rgb(0 0 0 / .06);
}
/* 共享度量（与主题无关）：控件尺寸/圆角阶梯 —— 放在公共 :root，
   避免浅色/深色两个主题块漏抄导致 var() 失效（深色下 button 变 18px/0 圆角就是这么来的） */
:root{
  --control-height-regular:34px; --control-radius-regular:1000px;
  --control-padding-x-regular:12px; --control-font-regular:17px;
  --control-height-large:44px; --control-padding-x-large:18px;
  --radius-card:18px; --radius-control:1000px; --radius-thumb:10px;
}
:root[data-theme="dark"]{
  --system-blue:rgb(0 145 255); --system-red:rgb(255 66 69);
  --system-green:rgb(48 209 88); --system-orange:rgb(255 146 48);
  --label:rgb(255 255 255);
  --label-2:rgb(235 235 245 / .6); --label-3:rgb(235 235 245 / .3); --label-4:rgb(235 235 245 / .16);
  --fill:rgb(120 120 128 / .36); --fill-2:rgb(120 120 128 / .32);
  --fill-3:rgb(118 118 128 / .24); --fill-4:rgb(118 118 128 / .18);
  --background-1:rgb(28 28 30); --background-2:rgb(0 0 0); --background-3:rgb(44 44 46);
  --separator:rgb(84 84 88 / .65); --separator-opaque:rgb(56 56 58);
  --material-glass-bg:rgb(48 48 50 / .62);
  --material-glass-fallback:rgb(18 18 20);
  --material-glass-blur:16px; --material-glass-saturate:2.2;
  --material-glass-clear-bg:rgb(255 255 255 / .25);
  --material-glass-clear-blur:10px; --material-glass-clear-saturate:1.8;
  --material-regular-bg:rgb(22 22 23 / .8);
  --material-regular-blur:20px; --material-regular-saturate:1.8;
  --elevation-glass:inset 0 0 0 1px rgb(255 255 255 / .2), 0 10px 40px rgb(0 0 0 / .2);
  --elevation-card:0 8px 28px rgb(0 0 0 / .6), inset 0 0 0 1px rgb(255 255 255 / .07);
  --fill-pill:rgb(118 118 128 / .16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 必须放在所有 display 规则之后：组件的 display:flex 会覆盖浏览器默认的 [hidden]{display:none}，
   导致 hidden 元素仍显示并拦截点击 */
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background-2);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",
    "Inter Variable","Inter","PingFang SC","Noto Sans SC",
    "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:17px;line-height:22px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .3s ease,color .3s ease}
button,input,textarea{font-family:inherit}
.btn{user-select:none;-webkit-user-select:none}

/* ---------- Liquid Glass 材质 ----------
   Liquid Glass 是「浮在内容之上的功能层」（导航栏、玻璃按钮），
   大面积内容卡用普通材质（backdrop-filter）—— 位移贴图在大平面上会被拉伸产生噪点。 */
.lg-defs{position:absolute;width:0;height:0;pointer-events:none}
.glass{position:relative;overflow:hidden;isolation:isolate}
.glass__warp{position:absolute;inset:0;pointer-events:none;z-index:0}
.has-glass .glass__warp{
  filter:url(#lg-filter);
  backdrop-filter:blur(10px) saturate(180%);
  -webkit-backdrop-filter:blur(10px) saturate(180%);
}
.has-glass .glass{
  background:var(--material-glass-bg);
  box-shadow:var(--elevation-glass);
}
.has-glass .glass--clear{background:var(--material-glass-clear-bg)}
/* 内容层材质：只有 backdrop，不做位移 */
.material{position:relative;overflow:hidden;isolation:isolate}
.material::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:var(--material-regular-bg);
  backdrop-filter:blur(var(--material-regular-blur)) saturate(var(--material-regular-saturate));
  -webkit-backdrop-filter:blur(var(--material-regular-blur)) saturate(var(--material-regular-saturate));
}
.no-glass .glass{background:var(--material-glass-fallback)}
/* 内容层置顶，但不要覆盖 .glass__warp 自身的 absolute 定位（否则玻璃层会撑破按钮布局）*/
.glass > *:not(.glass__warp),.material > *{position:relative;z-index:1}
/* 玻璃按钮不是 .glass 的子元素，需单独抬升文字层级，否则会被玻璃层吞掉 */
.btn.glassbtn > *:not(.glass__warp){position:relative;z-index:1}

/* ---------- 毛玻璃导航 ---------- */
.nav{position:sticky;top:0;z-index:30}
.nav .nav-in{position:relative}
.nav .nav-glass{position:absolute;inset:0;z-index:0;background:var(--material-glass-bg);
  border-bottom:1px solid var(--separator)}
.nav > .nav-in > *{position:relative;z-index:1}
.nav-in{max-width:980px;margin:0 auto;padding:0 22px;height:52px;
  display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.navlinks{display:flex;gap:24px;font-size:12px;color:var(--label-2)}
.iconbtn{width:32px;height:32px;border-radius:50%;border:0;cursor:pointer;
  background:var(--fill-3);color:var(--label);display:grid;place-items:center;
  transition:background .2s ease}
.iconbtn:hover{background:var(--fill-2)}

main{max-width:680px;margin:0 auto;padding:52px 22px 96px}

/* ---------- Hero（Large Title 34/41 w400）---------- */
.hero{text-align:center;margin-bottom:36px}
.hero h1{font-size:clamp(32px,6vw,44px);line-height:1.18;letter-spacing:-.022em;
  font-weight:700;margin:0 0 10px;font-optical-sizing:auto}
.hero p{font-size:17px;line-height:22px;color:var(--label-2);margin:0 auto;max-width:32em;
  letter-spacing:-.01em}
.pills{margin-top:20px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--control-radius-regular);
  background:var(--fill-pill);font-size:13px;color:var(--label-2);letter-spacing:-.01em}

/* ---------- 输入区（内容层材质）---------- */
.composer{border-radius:var(--radius-card);padding:18px;margin-bottom:16px;
  box-shadow:var(--elevation-card);transition:box-shadow .2s ease}
.composer:focus-within{box-shadow:var(--elevation-card),0 0 0 3px color-mix(in srgb,var(--system-blue) .18,transparent)}
.composer textarea{width:100%;min-height:76px;border:0;background:transparent;color:var(--label);
  font:16px/24px inherit;resize:none;outline:none;display:block}
.composer textarea::placeholder{color:var(--label-3)}
.cbar{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{height:var(--control-height-regular);padding:0 var(--control-padding-x-regular);
  border-radius:var(--control-radius-regular);border:0;cursor:pointer;
  font:500 17px/1 inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;transition:background .18s ease,transform .12s ease,opacity .18s}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--system-blue);color:#fff}
.btn.fill:hover{filter:brightness(1.06)}
.btn.tint{background:color-mix(in srgb,var(--system-blue) .13,transparent);color:var(--system-blue)}
.btn.tint:hover{background:var(--system-blue);color:#fff}
.btn.plain{background:transparent;color:var(--label-2);padding:0 10px}
.btn.plain:hover{color:var(--label)}
.btn.glassbtn{position:relative;overflow:hidden;isolation:isolate;background:var(--material-glass-bg);
  color:var(--label);box-shadow:var(--elevation-glass)}
.btn.glassbtn .glass__warp{filter:url(#lg-filter);
  backdrop-filter:blur(10px) saturate(180%);-webkit-backdrop-filter:blur(10px) saturate(180%)}
/* 玻璃层是定位元素，会盖住裸文本节点 → 文字必须包在 span 里并抬到上层 */
.btn-label{position:relative;z-index:1}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.spacer{flex:1}
.hint{font-size:13px;color:var(--label-3)}

/* 苹果活动指示器：八条淡出竖条 */
.spin{width:16px;height:16px;display:inline-block;position:relative;flex:none}
.spin i{position:absolute;left:50%;top:50%;width:2px;height:6px;border-radius:1px;
  background:currentColor;transform-origin:50% 0;
  animation:apple-spin 1.1s linear infinite}
.spin i:nth-child(1){transform:translate(-50%,-8px) rotate(0deg);animation-delay:0s}
.spin i:nth-child(2){transform:translate(-50%,-8px) rotate(45deg);animation-delay:.07s}
.spin i:nth-child(3){transform:translate(-50%,-8px) rotate(90deg);animation-delay:.14s}
.spin i:nth-child(4){transform:translate(-50%,-8px) rotate(135deg);animation-delay:.21s}
.spin i:nth-child(5){transform:translate(-50%,-8px) rotate(180deg);animation-delay:.28s}
.spin i:nth-child(6){transform:translate(-50%,-8px) rotate(225deg);animation-delay:.35s}
.spin i:nth-child(7){transform:translate(-50%,-8px) rotate(270deg);animation-delay:.42s}
.spin i:nth-child(8){transform:translate(-50%,-8px) rotate(315deg);animation-delay:.49s}
@keyframes apple-spin{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}

/* ---------- 提示条 / 错误 ---------- */
.notice,.err{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:12px;
  background:var(--material-regular-bg);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:var(--elevation-glass);font-size:13px;line-height:1.45;margin-bottom:16px;color:var(--label-2)}
.notice svg,.err svg{flex:none;margin-top:2px}
.notice svg{color:var(--system-orange)}
.err{color:var(--label);align-items:center}
.err svg{color:var(--system-red)}
.err b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.err .raw{display:block;color:var(--label-3);font-size:12px;word-break:break-all;margin-top:4px}

/* ---------- 结果卡片 ---------- */
.card{border-radius:var(--radius-card);box-shadow:var(--elevation-card);overflow:hidden;
  background:var(--background-1);animation:rise .42s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chead{display:flex;gap:16px;padding:20px}
.cover{width:112px;height:112px;border-radius:var(--radius-thumb);object-fit:cover;
  background:var(--fill-4);flex:none;border:1px solid var(--separator)}
.cbody{min-width:0;flex:1}
.cbadges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:var(--control-radius-regular);
  background:var(--fill-3);font-size:12px;color:var(--label-2);letter-spacing:-.01em;white-space:nowrap}
.badge.blue{background:color-mix(in srgb,var(--system-blue) .13,transparent);color:var(--system-blue)}
.badge.green{background:color-mix(in srgb,var(--system-green) .13,transparent);color:var(--system-green)}
.badge.orange{background:color-mix(in srgb,var(--system-orange) .13,transparent);color:var(--system-orange)}
.ctitle{font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;
  word-break:break-word}
.cby{font-size:13px;color:var(--label-2)}
.qbar{display:flex;align-items:center;gap:12px;padding:0 20px 16px;flex-wrap:wrap}
.qbar .lbl{font-size:13px;color:var(--label-3)}

/* 分段控制器（Apple Segmented Control）*/
.seg{display:inline-flex;background:var(--fill-3);border-radius:9px;padding:2px;gap:2px;
  max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;color:var(--label);cursor:pointer;
  padding:6px 13px;border-radius:7px;font:500 13px/1 inherit;white-space:nowrap;
  transition:background .18s ease,box-shadow .18s ease}
.seg button.on{background:var(--background-1);box-shadow:0 1px 2px rgb(0 0 0 / .1),0 3px 8px rgb(0 0 0 / .06)}
.rows{border-top:1px solid var(--separator)}
.row{display:flex;align-items:center;gap:14px;padding:12px 20px}
.row+.row{border-top:1px solid var(--separator)}
.thumb{width:52px;height:52px;border-radius:var(--radius-thumb);object-fit:cover;
  background:var(--fill-4);flex:none;border:1px solid var(--separator);cursor:zoom-in}
.thumb.ph{display:grid;place-items:center;color:var(--label-3);cursor:default}
.rmain{flex:1;min-width:0}
.rname{font-size:15px;line-height:20px;letter-spacing:0;word-break:break-all;
  font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  font-size:13.5px}
.rmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:3px;
  font-size:12.5px;color:var(--label-3);font-variant-numeric:tabular-nums;
  letter-spacing:0}
.rmeta .live{color:var(--system-orange)}
.rmeta .warn{color:var(--system-orange)}
.dl{height:30px;padding:0 14px;border-radius:var(--control-radius-regular);border:0;cursor:pointer;
  text-decoration:none;background:var(--system-blue);color:#fff;font:500 13px/1 inherit;
  display:inline-flex;align-items:center;gap:5px;flex:none;white-space:nowrap;
  transition:background .18s ease}
.dl:hover{filter:brightness(1.06)}
.dl.done{background:var(--system-green)}
.dl.sec{background:var(--fill-3);color:var(--label)}
.dl.sec:hover{background:var(--fill-2)}
video.preview{width:100%;max-height:52vh;background:#000;display:block;aspect-ratio:16/9}

/* ---------- 骨架屏 ---------- */
.sk{background:linear-gradient(90deg,var(--fill-4) 0%,var(--fill-3) 50%,var(--fill-4) 100%);
  background-size:200% 100%;animation:shim 1.4s ease-in-out infinite;border-radius:4px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:12px;margin-bottom:9px}
.sk-line.med{width:75%}
.sk-line.short{width:40%;height:10px}
.sk-card{background:var(--background-1);border-radius:var(--radius-card);
  box-shadow:var(--elevation-card);padding:20px;margin-bottom:16px}
.sk-thumb{width:112px;height:112px;border-radius:var(--radius-thumb);flex:none}

/* ---------- Lightbox ---------- */
.lb{position:fixed;inset:0;z-index:60;background:rgb(0 0 0 / .72);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;padding:32px;cursor:zoom-out;
  animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}

/* ---------- 口令浮层 ---------- */
#gate{position:fixed;inset:0;z-index:80;background:rgb(0 0 0 / .55);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{background:var(--background-1);border-radius:var(--radius-card);
  box-shadow:var(--elevation-card);padding:28px;width:100%;max-width:340px;
  animation:rise .3s cubic-bezier(.16,1,.3,1)}
.gate-box h2{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.gate-box p{font-size:13px;color:var(--label-2);margin:0 0 16px}
.gate-box input{width:100%;height:40px;padding:0 14px;border-radius:10px;
  border:1px solid var(--separator-opaque);background:var(--fill-4);color:var(--label);
  font:15px inherit;outline:none}
.gate-box input:focus{border-color:var(--system-blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--system-blue) .18,transparent)}
.gate-box .btn{width:100%;margin-top:12px;height:40px}
.gate-err{color:var(--system-red);font-size:13px;margin-top:10px;display:none}

footer{margin-top:44px;text-align:center;font-size:12px;color:var(--label-3);line-height:1.8}

@media(max-width:600px){
  main{padding:30px 16px 72px}
  .nav-in{padding:0 16px}
  .navlinks{display:none}
  .hero h1{font-size:30px}
  .hero p{font-size:16px}
  .chead{padding:16px;gap:12px}
  .cover{width:84px;height:84px}
  .row{padding:10px 16px;gap:10px}
  .thumb{width:44px;height:44px}
  .qbar{padding:0 16px 14px}
  .rname{font-size:14px}
  .dl{height:28px;padding:0 12px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
/* 降低透明度偏好：玻璃换成不透明材质 */
@media(prefers-reduced-transparency:reduce){
  .nav,.notice,.err{backdrop-filter:none;background:var(--background-1)}
  .has-glass .glass{background:var(--material-glass-fallback)}
}
</style>
</head>
<body>

<nav class="nav"><div class="nav-glass"></div><div class="nav-in">
  <div class="brand">解析下载站</div>
  <div class="navlinks"><span>小红书</span><span>抖音</span><span>X</span><span>YouTube</span></div>
  <button class="iconbtn" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  </button>
</div></nav>

<main>
  <div class="hero">
    <h1>粘贴链接，下载无水印原画</h1>
    <p>支持小红书、抖音、X 与 YouTube，保留原图画质与图文实况动图</p>
    <div class="pills">
      <span class="pill">无水印</span>
      <span class="pill">原画画质</span>
      <span class="pill">图文动图</span>
    </div>
  </div>

  <div class="composer glass">
    <span class="glass__warp"></span>
    <textarea id="input" placeholder="粘贴分享链接或整段分享文案…"></textarea>
    <div class="cbar">
      <button class="btn fill" id="parseBtn">解析</button>
      <button class="btn plain" id="clearBtn">清空</button>
      <div class="spacer"></div>
      <span class="hint">Enter 解析 · Shift+Enter 换行</span>
    </div>
  </div>

  <div class="notice" id="notice" hidden>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>
    <span>解析出的直链有时效（约 6 小时），下载失败请重新解析</span>
  </div>

  <div class="err" id="error" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <div style="flex:1;min-width:0">
      <b id="errorTitle">解析失败</b>
      <span id="errorMsg"></span>
      <span class="raw" id="errorRaw"></span>
    </div>
  </div>

  <div id="result"></div>
</main>

<footer>仅供个人学习归档使用 · 请尊重创作者版权</footer>
